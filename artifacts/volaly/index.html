<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <!-- Primary meta -->
    <title>Volaly — Turn Visibility into Revenue | Business Growth Platform</title>
    <meta name="description" content="Volaly is the AI Business Growth Platform. Create content, attract customers, convert enquiries and grow revenue automatically across Google, LINE, WhatsApp and more." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ff6b35" />

    <!-- Canonical (SPA default; overridden per-page by SEO component) -->
    <link rel="canonical" href="https://volaly.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Volaly" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://volaly.com/" />
    <meta property="og:title" content="Volaly — Turn Visibility into Revenue" />
    <meta property="og:description" content="Create. Attract. Convert. Grow. The AI Business Growth Platform for local businesses." />
    <meta property="og:image" content="https://volaly.com/og-image.png" />
    <meta property="og:image:width" content="1734" />
    <meta property="og:image:height" content="907" />
    <meta property="og:image:alt" content="Volaly — AI Revenue System for Local Businesses" />

    <!-- Twitter / X Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Volaly — Turn Visibility into Revenue" />
    <meta name="twitter:description" content="The AI Business Growth Platform. Create. Attract. Convert. Grow." />
    <meta name="twitter:image" content="https://volaly.com/og-image.png" />
    <meta name="twitter:image:alt" content="Volaly — AI Revenue System for Local Businesses" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/volaly-logo.png" />

    <!-- Fonts: preconnect before stylesheet to reduce render-blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />

    <!-- Preconnect for embedded video (YouTube) -->
    <link rel="preconnect" href="https://www.youtube-nocookie.com" />
    <link rel="dns-prefetch" href="https://www.youtube-nocookie.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
